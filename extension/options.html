<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딱 하나 설정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --ink: #1b1033;
    --muted: #6b5b8a;
    --line: #ece6f6;
    --accent: #ff2d95;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 48px 24px;
    display: flex;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a3d, #ff2d95 55%, #7c3aed);
    font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink);
  }
  main {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 24px;
    padding: 36px;
    box-shadow: 0 24px 64px rgba(40, 10, 60, 0.28);
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  .lead { margin: 8px 0 28px; color: var(--muted); font-size: 15px; line-height: 1.6; }
  fieldset { margin: 0 0 24px; padding: 0; border: 0; }
  legend { padding: 0; font-size: 15px; font-weight: 700; }
  .choice {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-top: 12px;
    padding: 14px 16px;
    border: 2px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
  }
  .choice:has(input:checked) { border-color: var(--accent); background: #fff5fa; }
  .choice input { margin: 3px 0 0; accent-color: var(--accent); }
  .choice strong { display: block; font-size: 15px; }
  .choice span { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 0;
    border-top: 1px solid var(--line);
    font-size: 15px;
  }
  .row span { color: var(--muted); font-size: 13px; display: block; margin-top: 2px; }
  input[type="number"] {
    width: 96px;
    padding: 10px 12px;
    border: 2px solid var(--line);
    border-radius: 10px;
    font: inherit;
    font-size: 15px;
    text-align: right;
  }
  input[type="number"]:focus, input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); }
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 28px;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, #ff6a3d, #ff2d95 60%, #7c3aed);
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.06); }
  .status { margin: 12px 0 0; min-height: 20px; text-align: center; color: var(--accent); font-size: 14px; font-weight: 600; }
  @media (max-width: 480px) {
    body { padding: 24px 16px; }
    main { padding: 24px; }
  }
</style>
</head>
<body>
<main>
  <h1>딱 하나</h1>
  <p class="lead">유튜브에서 영상 하나를 다 보면 브라우저 창을 전부 닫습니다. 기준은 아래에서 고르세요.</p>

  <form id="form">
    <fieldset>
      <legend>언제 닫을까요</legend>
      <label class="choice">
        <input type="radio" name="mode" value="end" checked>
        <span>
          <strong>영상이 끝나면</strong>
          <span>끝까지 재생되면 한 편으로 칩니다. 쇼츠는 한 바퀴 돌면 끝으로 봅니다.</span>
        </span>
      </label>
      <label class="choice">
        <input type="radio" name="mode" value="seconds">
        <span>
          <strong>정해진 시간만큼 보면</strong>
          <span>실제로 재생된 시간만 쌓입니다. 건너뛴 구간은 빼고 셉니다.</span>
        </span>
      </label>
    </fieldset>

    <div class="row">
      <label for="seconds">재생 시간 기준<span>위에서 "정해진 시간"을 골랐을 때만 씁니다 (초)</span></label>
      <input type="number" id="seconds" name="seconds" min="10" max="36000" step="10">
    </div>
    <div class="row">
      <label for="countdown">카운트다운<span>닫히기 전에 보여 줄 시간 (초, 0이면 바로)</span></label>
      <input type="number" id="countdown" name="countdown" min="0" max="60" step="1">
    </div>
    <div class="row">
      <label for="cancelButton">취소 버튼 보이기<span>끄면 카운트다운을 멈출 방법이 없습니다</span></label>
      <input type="checkbox" id="cancelButton" name="cancelButton">
    </div>

    <button type="submit">저장</button>
    <p class="status" id="status" role="status"></p>
  </form>
</main>
<script src="options.js"></script>
</body>
</html>
